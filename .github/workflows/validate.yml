name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 校验 qsh-form
        run: node scripts/validate-qsh-form.mjs SKILL.md
      # 3.9 is not for running the skill; it is the version the preflight has to survive
      # long enough to say "install 3.10".
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 脚本自检
        run: python scripts/selftest.py
